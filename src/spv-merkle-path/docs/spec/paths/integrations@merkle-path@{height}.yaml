get:
  summary: Get merkle path by block height
  parameters:
    - name: height
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/MerklePathResponse'
    '400':
      description: Bad Request
    '404':
      description: Not Found
